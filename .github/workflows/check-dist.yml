# dist/index.js is committed because GitHub Actions executes it directly and
# never installs node_modules for an action. That makes it easy to forget to
# rebuild, so this rebuilds it and fails the pull request on any difference.
name: Check dist

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rebuild dist/
        run: |
          rm -rf dist
          pnpm build

      - name: Compare against the committed bundle
        id: diff
        run: |
          if [ -n "$(git diff --ignore-space-at-eol --text --name-only dist/)" ]; then
            echo "dist/ is out of date. Run 'pnpm build' and commit the result." >&2
            git diff --ignore-space-at-eol --text --stat dist/ >&2
            exit 1
          fi

      - if: failure() && steps.diff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: expected-dist
          path: dist/
