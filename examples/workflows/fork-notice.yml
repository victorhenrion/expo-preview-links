# OPTIONAL. Nothing depends on this workflow.
#
# Fork contributors get no preview build, and with no explanation that reads as
# the tool being broken. This posts a one-line notice telling them why.
#
# ============================== READ THIS ==============================
# THIS WORKFLOW MUST NOT CHECK OUT THE PULL REQUEST HEAD, AND MUST NOT
# RESTORE AN ACTIONS CACHE.
#
# `workflow_run` is a PRIVILEGED trigger: it runs with repository secrets and a
# write-scoped token, in the context of the default branch. Checking out fork
# head code here and running anything that executes it -- eas-cli evaluates
# app.config.js, and npm install runs lifecycle scripts -- is arbitrary code
# execution with your secrets. Restoring a cache is the same hazard one step
# removed: privileged jobs share the default-branch cache, which an
# unprivileged fork job can poison.
#
# This workflow only ever reads an event payload and posts a comment.
# =======================================================================
#
# Note: workflow_run workflows only run when they exist on the DEFAULT branch,
# so you cannot test changes to this file from within a pull request.
name: Expo preview fork notice

on:
  workflow_run:
    workflows: ["Expo preview"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

# github.ref is the default branch for workflow_run, so grouping on it would
# serialise every pull request into a single queue. Group on the head branch.
concurrency:
  group: expo-preview-fork-notice-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  notice:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Comment on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;

            // workflow_run.pull_requests is EMPTY for pull requests from forks,
            // so resolve the number from the head sha instead.
            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              });
              prNumber = data[0]?.number;
            }
            if (!prNumber) {
              core.info('Could not resolve a pull request number; nothing to do.');
              return;
            }

            // Only speak up for forks -- same-repo PRs get a real preview comment.
            if (run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Same-repo pull request; the preview comment covers it.');
              return;
            }

            const marker = '<!-- expo-preview-links:fork-notice -->';
            const body = [
              marker,
              '### 📱 No preview build for this pull request',
              '',
              'Preview builds are skipped for pull requests from forks. GitHub withholds',
              'repository secrets from fork pull requests, so the build cannot be signed or',
              'uploaded — this is a deliberate safety property, not a misconfiguration.',
              '',
              'A maintainer can produce a preview by pushing this branch to the main repository.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => (c.body ?? '').startsWith(marker) && c.user?.type === 'Bot',
            );
            if (existing) {
              core.info('Notice already posted.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
